[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemakernel"
version = "0.1.0"
description = "Adaptive form engine powered by LLM-driven structured field planning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10,<3",
    "instructor>=1.14,<2",
    "anthropic>=0.40,<1",
    "openai>=1.40",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "openinference-instrumentation-instructor>=0.1",
    "structlog>=24.2",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schemakernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
