replicaCount: 1

image:
  repository: schemakernel
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Environment variables for the application
env:
  # Provider and Model
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
  
  # Storage
  # DATABASE_URL: "postgresql://user:pass@host:5432/db"
  # DYNAMODB_TABLE: "schemakernel-states"
  
  # Telemetry
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  
  # Redaction
  # PRESIDIO_ENTITIES: "PERSON,EMAIL_ADDRESS,PHONE_NUMBER"
  APP_PORT: "8080"

nodeSelector: {}
tolerations: []
affinity: {}
